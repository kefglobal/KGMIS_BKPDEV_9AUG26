/* ==========================================================
   KGMIS Self-Service Portal
   Shared Styles
   ========================================================== */

.ssp-module{

    --ssp-primary:#176c91;
    --ssp-primary-dark:#0d4e70;
    --ssp-primary-light:#e7f4f9;

    --ssp-success:#15803d;
    --ssp-warning:#ca8a04;
    --ssp-danger:#b42318;

    --ssp-border:#d5e0e8;

    --ssp-background:#f8fafc;

    --ssp-panel:#ffffff;

    --ssp-text:#1f2937;

    --ssp-muted:#64748b;

    --ssp-shadow:
        0 8px 24px
        rgba(13,78,112,.08);

    font-family:

        Arial,
        Helvetica,
        sans-serif;

    color:

        var(--ssp-text);

}

/* ==========================================================
   Global
   ========================================================== */

.ssp-module *,
.ssp-module *::before,
.ssp-module *::after{

    box-sizing:border-box;

}

/* ==========================================================
   Header
   ========================================================== */

.ssp-header{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    gap:24px;

    margin-bottom:22px;

}

.ssp-header-left{

    flex:1;

}

.ssp-module-title{

    margin-bottom:6px;

    color:var(--ssp-primary);

    font-size:11px;

    font-weight:900;

    letter-spacing:.08em;

    text-transform:uppercase;

}

.ssp-header h1{

    margin:0;

    color:var(--ssp-primary-dark);

    font-size:30px;

    font-weight:700;

}

.ssp-greeting{

    margin-top:8px;

    color:var(--ssp-muted);

    font-size:14px;

}

/* ==========================================================
   Progress Card
   ========================================================== */

.ssp-progress-card{

    width:220px;

    padding:16px;

    border-radius:14px;

    border:1px solid #b9d7e6;

    background:

        var(--ssp-primary-light);

}

.ssp-progress-title{

    color:var(--ssp-muted);

    font-size:10px;

    font-weight:900;

    letter-spacing:.06em;

    text-transform:uppercase;

}

.ssp-progress-value{

    margin:6px 0 10px;

    color:var(--ssp-primary-dark);

    font-size:22px;

    font-weight:700;

}

.ssp-progress-bar{

    height:8px;

    border-radius:999px;

    background:#cfe3ec;

    overflow:hidden;

}

.ssp-progress-fill{

    width:0;

    height:100%;

    border-radius:inherit;

    background:

        linear-gradient(

            90deg,

            var(--ssp-primary-dark),

            var(--ssp-primary)

        );

}

/* ==========================================================
   Main Layout
   ========================================================== */

.ssp-main-layout{

    display:grid;

    grid-template-columns:

        270px

        1fr;

    gap:20px;

    align-items:start;

}

/* ==========================================================
   Sidebar
   ========================================================== */

.ssp-sidebar{

    border:1px solid var(--ssp-border);

    border-radius:14px;

    background:var(--ssp-panel);

    box-shadow:var(--ssp-shadow);

    overflow:hidden;

}

.ssp-sidebar-title{

    padding:16px 18px;

    border-bottom:1px solid #e5edf2;

    background:#f7fbfd;

    color:var(--ssp-primary-dark);

    font-size:15px;

    font-weight:700;

}

/* ==========================================================
   Wizard
   ========================================================== */

#sspWizardNavigation{

    display:flex;

    flex-direction:column;

}

.ssp-step{

    display:flex;

    align-items:center;

    gap:14px;

    width:100%;

    padding:14px 18px;

    border:0;

    border-bottom:1px solid #edf2f6;

    background:#ffffff;

    text-align:left;

    cursor:pointer;

    transition:

        background .18s ease,

        color .18s ease;

}

.ssp-step:last-child{

    border-bottom:none;

}

.ssp-step:hover{

    background:#f3f8fb;

}

.ssp-step-number{

    width:28px;

    height:28px;

    display:grid;

    place-items:center;

    border-radius:50%;

    background:#dcecf4;

    color:var(--ssp-primary-dark);

    font-size:12px;

    font-weight:700;

}

.ssp-step-text{

    font-size:14px;

    font-weight:600;

}

.ssp-step.active{

    background:

        linear-gradient(

            135deg,

            var(--ssp-primary-dark),

            var(--ssp-primary)

        );

    color:#ffffff;

}

.ssp-step.active .ssp-step-number{

    background:#ffffff;

    color:var(--ssp-primary-dark);

}

.ssp-step.completed{

    background:#f0fdf4;

}

.ssp-step.completed
.ssp-step-number{

    background:var(--ssp-success);

    color:#ffffff;

}

/* ==========================================================
   Workspace
   ========================================================== */

.ssp-workspace{

    min-height:720px;

    border:1px solid var(--ssp-border);

    border-radius:14px;

    background:#ffffff;

    box-shadow:var(--ssp-shadow);

    padding:24px;

}

/* ==========================================================
   Footer
   ========================================================== */

.ssp-footer{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:20px;

    margin-top:24px;

}

.ssp-footer-left,
.ssp-footer-right{

    display:flex;

    align-items:center;

    gap:12px;

}

/* ==========================================================
   Buttons
   ========================================================== */

.ssp-primary-button{

    min-width:140px;

    min-height:42px;

    padding:10px 20px;

    border:0;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            var(--ssp-primary-dark),
            var(--ssp-primary)
        );

    color:#ffffff;

    font-size:14px;

    font-weight:700;

    font-family:inherit;

    cursor:pointer;

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        filter .18s ease;

}

.ssp-primary-button:hover{

    transform:translateY(-2px);

    filter:brightness(1.03);

    box-shadow:
        0 8px 20px
        rgba(13,78,112,.22);

}

.ssp-primary-button:disabled{

    opacity:.55;

    cursor:not-allowed;

    transform:none;

    box-shadow:none;

}

.ssp-secondary-button{

    min-width:120px;

    min-height:42px;

    padding:10px 18px;

    border:1px solid #bfd4df;

    border-radius:10px;

    background:#ffffff;

    color:var(--ssp-primary-dark);

    font-size:14px;

    font-weight:700;

    font-family:inherit;

    cursor:pointer;

    transition:
        background .18s ease,
        border-color .18s ease;

}

.ssp-secondary-button:hover{

    background:#f5fafc;

    border-color:var(--ssp-primary);

}

.ssp-secondary-button:disabled{

    opacity:.55;

    cursor:not-allowed;

}

/* ==========================================================
   Status Colours
   ========================================================== */

.ssp-status-pending{

    color:#92400e;

}

.ssp-status-completed{

    color:#15803d;

}

.ssp-status-error{

    color:#b42318;

}

/* ==========================================================
   Hidden Pages
   ========================================================== */

.ssp-page{

    display:none;

}

.ssp-page.active{

    display:block;

}

/* ==========================================================
   Loading
   ========================================================== */

.ssp-loading{

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:240px;

    color:var(--ssp-muted);

    font-size:15px;

}

/* ==========================================================
   Message Bar
   ========================================================== */

.ssp-message{

    margin-bottom:18px;

    padding:14px 16px;

    border-radius:10px;

    display:none;

}

.ssp-message.info{

    display:block;

    background:#eef8fc;

    border:1px solid #b9d7e6;

    color:#155c7b;

}

.ssp-message.success{

    display:block;

    background:#ecfdf5;

    border:1px solid #bbf7d0;

    color:#166534;

}

.ssp-message.error{

    display:block;

    background:#fef2f2;

    border:1px solid #fecaca;

    color:#b42318;

}

/* ==========================================================
   Responsive
   ========================================================== */

@media (max-width:960px){

    .ssp-main-layout{

        grid-template-columns:1fr;

    }

    .ssp-sidebar{

        order:2;

    }

    .ssp-workspace{

        order:1;

    }

}

@media (max-width:640px){

    .ssp-header{

        flex-direction:column;

    }

    .ssp-progress-card{

        width:100%;

    }

    .ssp-footer{

        flex-direction:column;

        align-items:stretch;

    }

    .ssp-footer-left,
    .ssp-footer-right{

        width:100%;

        justify-content:space-between;

    }

    .ssp-primary-button,
    .ssp-secondary-button{

        flex:1;

    }

}

</style>
