<style>
  :root {
    --primary: #176c91;
    --primary-dark: #0d4e70;
    --secondary: #49a6c4;
    --accent: #0aa957;

    --background: #f3f7fa;
    --surface: #ffffff;
    --surface-soft: #f7fafc;
    --border: #d6e1e8;

    --text: #1f2937;
    --muted: #64748b;

    --success: #166534;
    --success-bg: #dcfce7;
    --warning: #92400e;
    --warning-bg: #fef3c7;
    --danger: #991b1b;
    --danger-bg: #fee2e2;

    --shadow:
      0 8px 26px rgba(20, 72, 96, 0.10);

    --radius-large: 16px;
    --radius-medium: 11px;
    --radius-small: 8px;
  }


  * {
    box-sizing: border-box;
  }


  html {
    scroll-behavior: smooth;
  }


  body {
    margin: 0;
    font-family:
      Arial,
      Helvetica,
      sans-serif;
    color: var(--text);
    background: var(--background);
  }


  button,
  input,
  select,
  textarea {
    font: inherit;
  }


  #kgmisApp button {
    min-height: 44px;
    padding: 10px 18px;
    border: 0;
    border-radius: var(--radius-small);
    color: #ffffff;
    background: var(--primary);
    font-weight: 700;
    cursor: pointer;
    transition:
      background 0.15s ease,
      transform 0.15s ease,
      opacity 0.15s ease;
  }


  #kgmisApp button:hover:not(:disabled) {
    background: var(--primary-dark);
    transform: translateY(-1px);
  }


  #kgmisApp button:disabled {
    cursor: not-allowed;
    opacity: 0.55;
  }


  input,
  select,
  textarea {
    width: 100%;
    min-height: 44px;
    padding: 10px 12px;
    border: 1px solid #b7c5cf;
    border-radius: var(--radius-small);
    color: var(--text);
    background: #ffffff;
    outline: none;
  }


  textarea {
    min-height: 110px;
    resize: vertical;
  }


  input:focus,
  select:focus,
  textarea:focus {
    border-color: var(--secondary);
    box-shadow:
      0 0 0 3px rgba(73, 166, 196, 0.15);
  }


  .hidden {
    display: none !important;
  }


  #kgmisApp {
    min-height: 100vh;
  }


  .portalHeader {
    position: relative;
    display: flex;
    align-items: center;
    gap: 20px;
    min-height: 170px;
    padding:
      28px
      max(24px, calc((100% - 1180px) / 2));
    color: #ffffff;
    background:
      linear-gradient(
        135deg,
        var(--primary-dark),
        var(--primary),
        var(--secondary)
      );
    overflow: hidden;
  }


  .portalHeader::before {
    content: "";
    position: absolute;
    width: 320px;
    height: 320px;
    right: -100px;
    bottom: -170px;
    border-radius: 50%;
    background:
      rgba(255, 255, 255, 0.08);
  }


  .portalLogo {
    position: relative;
    z-index: 2;
    flex: 0 0 auto;
  }


  .portalLogo .logo-container {
    margin: 0;
  }


  .portalLogo .kefg-logo {
    width: 112px;
    height: 112px;
    padding: 5px;
    border-radius: 50%;
    object-fit: contain;
    background: #ffffff;
    box-shadow:
      0 4px 15px rgba(0, 0, 0, 0.20);
  }


  .portalTitle {
    position: relative;
    z-index: 2;
  }


  .systemName {
    margin-bottom: 5px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    opacity: 0.88;
  }


  .portalTitle h1 {
    margin: 0 0 7px;
    font-size: 31px;
  }


  .portalTitle p {
    margin: 0;
    opacity: 0.92;
  }


  .environmentBadge {
    position: absolute;
    z-index: 2;
    top: 20px;
    right: 24px;
    padding: 7px 11px;
    border: 1px solid
      rgba(255, 255, 255, 0.40);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.05em;
  }


  .loadingPanel,
  .errorPanel,
  #wizardContainer {
    width:
      min(1180px, calc(100% - 30px));
    margin: 24px auto;
  }


  .loadingPanel {
    padding: 26px;
    border: 1px solid var(--border);
    border-radius: var(--radius-large);
    color: var(--muted);
    text-align: center;
    background: var(--surface);
    box-shadow: var(--shadow);
  }


  .errorPanel {
    padding: 15px;
    border: 1px solid #fca5a5;
    border-radius: var(--radius-medium);
    color: var(--danger);
    background: var(--danger-bg);
  }

.welcomeCard {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 240px;
  gap: 18px;
  align-items: center;

  margin-bottom: 14px;

  padding: 16px 22px;

  border-radius: var(--radius-large);

  color: #ffffff;

  background:
    linear-gradient(
      135deg,
      var(--primary-dark),
      var(--primary)
    );

  box-shadow: var(--shadow);
}

  .sectionCaption {
    color: #cceaf5;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }


  .welcomeCard h2 {
    margin: 2px 0 6px;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.25;
  }


  .welcomeCard p {
    margin: 0;
    font-size: 14px;
    line-height: 1.45;
    opacity: 0.94;
  }


  .completionCard {
    padding: 14px 16px;
    border-radius: 12px;
    background: #ffffff;
    color: var(--text);

  box-shadow:
    0 2px 8px rgba(0,0,0,.08);
    text-align: left;
  }


  .completionCard span {
    display: block;
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
  }


  .completionCard strong {
    display: block;
    margin: 4px 0 8px;
    color: var(--primary-dark);
    font-size: 18px;
    font-weight: 700;
  }


  .progressBar {
    width: 100%;
    height: 8px;
    border-radius: 999px;
    background: #e6e9ec;
    overflow: hidden;
  }


  #progressFill {
    width: 0;
    height: 100%;
    border-radius: inherit;
    transition:
    width .30s ease,
    background-color .30s ease;
  }


  .wizardNavigation {
    display: flex;
    gap: 9px;
    margin-bottom: 18px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-large);
    background: var(--surface);
    box-shadow: var(--shadow);
    overflow-x: auto;
  }


  .wizardButton {
    min-width: max-content;
    color: var(--primary-dark);
    border: 1px solid var(--border);
    background: #f3f8fb;
  }


  .wizardButton:hover:not(:disabled) {
    color: #ffffff;
  }


  .wizardButton.active {
    color: #ffffff;
    border-color: var(--primary);
    background: var(--primary);
  }


  #pageContainer {
    min-height: 360px;
  }


  .wizardPage {
    padding: 24px;
    border: 1px solid var(--border);
    border-radius: var(--radius-large);
    background: var(--surface);
    box-shadow: var(--shadow);
    animation: fadeIn 0.2s ease;
  }


  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(4px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }


  .pageHeader {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 20px;
  }


  .pageHeader h2 {
    margin: 4px 0 6px;
    color: var(--primary-dark);
  }


  .pageHeader p {
    margin: 0;
    color: var(--muted);
    line-height: 1.5;
  }


  .pageStatus {
    padding: 7px 11px;
    border-radius: 999px;
    color: var(--warning);
    background: var(--warning-bg);
    font-size: 12px;
    font-weight: 800;
    white-space: nowrap;
  }


  .pageStatus.complete {
    color: var(--success);
    background: var(--success-bg);
  }


  .overviewGrid {
    display: grid;
    grid-template-columns:
      repeat(2, minmax(0, 1fr));
    gap: 16px;
  }


  .overviewCard {
    padding: 18px;
    border: 1px solid var(--border);
    border-radius: var(--radius-medium);
    background: var(--surface-soft);
  }


  .overviewCard h3 {
    margin: 0 0 6px;
    color: var(--primary-dark);
  }


  .overviewCard p {
    margin: 0;
    color: var(--muted);
    line-height: 1.45;
  }


  .overviewCard button {
    margin-top: 14px;
  }


  .formGrid {
    display: grid;
    grid-template-columns:
      repeat(2, minmax(0, 1fr));
    gap: 17px;
  }


  .fieldGroup {
    min-width: 0;
  }


  .fieldGroup.fullWidth {
    grid-column: 1 / -1;
  }


  .fieldLabel {
    display: block;
    margin-bottom: 6px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }


  .fieldHelp {
    margin-top: 6px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.4;
  }


  .requiredMark {
    margin-left: 3px;
    color: var(--danger);
  }


  .sectionBlock {
    margin-top: 22px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }


  .sectionBlock:first-child {
    margin-top: 0;
    padding-top: 0;
    border-top: 0;
  }


  .sectionBlock h3 {
    margin: 0 0 14px;
    color: var(--primary-dark);
  }


  .decisionPanel {
    margin-bottom: 20px;
    padding: 18px;
    border: 1px solid #add8e8;
    border-radius: var(--radius-medium);
    background: #eef9fc;
  }


  .decisionPanel p {
    margin: 0 0 14px;
    font-weight: 700;
    line-height: 1.5;
  }


  .decisionActions {
    display: flex;
    gap: 10px;
  }


  .secondaryButton {
    background: #596d7d;
  }


  .photoLayout {
    display: grid;
    grid-template-columns:
      minmax(260px, 420px)
      minmax(0, 1fr);
    gap: 24px;
    align-items: start;
  }


  .photoFrame {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    border: 2px dashed #9eb7c5;
    border-radius: var(--radius-medium);
    background: #eef4f7;
    overflow: hidden;
  }


  .photoFrame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }


  .photoPlaceholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
    color: var(--muted);
    text-align: center;
    line-height: 1.5;
  }


  .photoControls {
    padding: 18px;
    border: 1px solid var(--border);
    border-radius: var(--radius-medium);
    background: var(--surface-soft);
  }


  .photoControls h3 {
    margin: 0 0 10px;
    color: var(--primary-dark);
  }


  .photoRules {
    margin: 0 0 16px;
    padding-left: 20px;
    color: var(--muted);
    line-height: 1.6;
  }


  .photoInput {
    margin-bottom: 10px;
  }


  .photoMessage {
    margin-top: 10px;
    padding: 10px;
    border-radius: var(--radius-small);
    font-size: 13px;
  }


  .photoMessage.success {
    color: var(--success);
    background: var(--success-bg);
  }


  .photoMessage.error {
    color: var(--danger);
    background: var(--danger-bg);
  }


  .consentBox {
    padding: 18px;
    border: 1px solid #bad8e5;
    border-radius: var(--radius-medium);
    background: #f0f8fb;
  }


  .consentBox p {
    margin: 0 0 15px;
    color: var(--text);
    line-height: 1.55;
  }


  .radioGroup {
    display: grid;
    gap: 10px;
  }


  .radioOption {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-small);
    background: #ffffff;
  }


  .radioOption input {
    width: auto;
    min-height: auto;
    margin-top: 2px;
  }


  .subscriptionPanel {
    display: grid;
    grid-template-columns:
      repeat(2, minmax(0, 1fr));
    gap: 18px;
    padding: 20px;
    border-radius: var(--radius-medium);
    background: var(--surface-soft);
  }


  .subscriptionLabel {
    display: block;
    margin-bottom: 6px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
  }


  .subscriptionBadge {
    display: inline-block;
    padding: 8px 13px;
    border-radius: 999px;
    font-weight: 800;
  }


  .subscriptionBadge.paid {
    color: var(--success);
    background: var(--success-bg);
  }


  .subscriptionBadge.notPaid {
    color: var(--danger);
    background: var(--danger-bg);
  }


  .subscriptionBadge.pending {
    color: var(--warning);
    background: var(--warning-bg);
  }


  .subscriptionBadge.exempted {
    color: #475569;
    background: #e2e8f0;
  }


  .informationNote {
    margin-top: 15px;
    padding: 13px;
    border-left: 4px solid var(--secondary);
    color: var(--muted);
    background: #eef8fb;
    line-height: 1.5;
  }


  .reviewGrid {
    display: grid;
    gap: 14px;
  }


  .reviewSection {
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius-medium);
    background: var(--surface-soft);
  }


  .reviewSection h3 {
    margin: 0 0 10px;
    color: var(--primary-dark);
  }


  .reviewRow {
    display: grid;
    grid-template-columns:
      minmax(170px, 0.45fr)
      minmax(0, 1fr);
    gap: 15px;
    padding: 8px 0;
    border-bottom: 1px solid #e5edf1;
  }


  .reviewRow:last-child {
    border-bottom: 0;
  }


  .reviewRow span:first-child {
    color: var(--muted);
    font-weight: 700;
  }


  .wizardFooter {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 18px;
    padding: 16px 0 0;
  }


  .portalFooter {
    padding: 24px 16px;
    color: var(--muted);
    text-align: center;
    font-size: 12px;
    line-height: 1.5;
  }


  @media (max-width: 820px) {
    .welcomeCard {
    grid-template-columns: 1fr;
    gap: 14px;
    padding: 16px;
  }

  .completionCard{
    width:100%;
  }


    .photoLayout {
      grid-template-columns: 1fr;
    }


    .overviewGrid,
    .formGrid,
    .subscriptionPanel {
      grid-template-columns: 1fr;
    }
  }


  @media (max-width: 650px) {
    .portalHeader {
      align-items: flex-start;
      gap: 14px;
      padding: 22px 16px;
    }


    .portalLogo .kefg-logo {
      width: 82px;
      height: 82px;
    }


    .portalTitle h1 {
      font-size: 23px;
    }


    .systemName {
      font-size: 11px;
    }


    .environmentBadge {
      display: none;
    }


    .loadingPanel,
    .errorPanel,
    #wizardContainer {
      width: calc(100% - 20px);
      margin: 14px auto;
    }


    .welcomeCard,
    .wizardPage {
      padding: 18px;
    }


    .wizardNavigation {
      border-radius: var(--radius-medium);
    }


    .pageHeader {
      flex-direction: column;
    }


    .decisionActions,
    .wizardFooter {
      flex-direction: column;
    }


    .wizardFooter button,
    .decisionActions button {
      width: 100%;
    }


    .reviewRow {
      grid-template-columns: 1fr;
      gap: 4px;
    }
  }

}

</style>
