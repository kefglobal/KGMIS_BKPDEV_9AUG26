  const KMIS_WIZARD_PAGES = [
    'overview',
    'member',
    'spouse',
    'photo',
    'family',
    'communication',
    'subscription',
    'review'
  ];

  let kmisConfiguration = null;
  let kmisProfile = null;
  let kmisFormData = {};
  let kmisOriginalFormData = {};
  let kmisSelectedPhoto = null;
  let kmisSelectedPhotoPreview = '';
  let kmisFamilyMembers = [];
  let kmisOriginalFamilyMembers = [];
  let kmisEditingFamilyMemberIndex = -1;
  let kmisCurrentPageIndex = 0;
  let kmisSpouseSectionEnabled = false;
  let kmisSessionToken = '';


  function activateFamilySelfServiceProfile(
  authContext
) {
  console.log('Family Profile activated');
  const auth =
    authContext || {};

  const sessionToken =
    String(
      auth.sessionToken || ''
    ).trim();
  kmisSessionToken = sessionToken;

  if (!sessionToken) {
    showError(
      'Your KGMIS session is missing. Please sign in again.'
    );

    return;
  }

  if (
    window.KMIS_FAMILY_PROFILE_INITIALISED !== true
  ) {
    window.KMIS_FAMILY_PROFILE_INITIALISED = true;

    bindWizardNavigation();
    bindFooterButtons();
  }

  initialisePortal(
    sessionToken
  );
}


  /**
   * Loads portal configuration and then opens the
   * token-linked family profile.
   */
  function initialisePortal(sessionToken) {
    console.log('Initialising portal');
    clearError();

    google.script.run
      .withSuccessHandler(function (configuration) {
        kmisConfiguration = configuration;

        const environmentBadge =
          document.getElementById('environmentBadge');

        if (
          environmentBadge &&
          configuration.application
        ) {
          environmentBadge.textContent =
            configuration.application.environment ||
            'DEVELOPMENT';
        }

        loadCurrentProfile(
          sessionToken
        );
      })
      .withFailureHandler(showError)
      .KMIS_FP_PORTAL_GetPublicConfiguration();
  }

  function loadCurrentProfile(sessionToken) {
        console.log('Loading current profile');

        sessionToken =
        String(
        sessionToken || ''
        ).trim();

  if (!sessionToken) {
    hideLoading();

    showError(
      'Your KGMIS session is missing. Please return to the Main Portal and sign in again.'
    );

    return;
  }

  google.script.run
    .withSuccessHandler(function (result) {

      kmisProfile = result.profile;

      initialiseFormData(kmisProfile);

      renderPortal();

    })
    .withFailureHandler(function (error) {

      hideLoading();

      showError(error);

    })
    .KMIS_FP_PORTAL_LoadCurrentProfile(
      sessionToken
    );
}

  /**
   * Loads the profile using the secure token supplied
   * through the personalised web-app URL.
   */
  function loadProfileFromToken() {
    const token =
      String(
        typeof KMIS_INITIAL_TOKEN !== 'undefined'
          ? KMIS_INITIAL_TOKEN
          : ''
      ).trim();

    if (!token) {
      hideLoading();

      showError(
        'This KEFG Family Profile link is incomplete. ' +
        'Please open the personalised link sent to you by KEFG.'
      );

      return;
    }

    google.script.run
      .withSuccessHandler(function (result) {
        kmisProfile = result.profile;

        initialiseFormData(kmisProfile);
        renderPortal();
      })
      .withFailureHandler(function (error) {
        hideLoading();
        showError(error);
      })
      .KMIS_FP_PORTAL_LoadByToken(token);
  }


  /**
   * Converts the server profile into one editable client object.
   */

      profile.spouse || {};

    const family =
      profile.family || {};

      Array.isArray(
        profile.familyMembers

        ? profile.familyMembers

      profile.communication || {};

      profile.subscription || {};

        spouse.exists ||

          profile.spouseSection.spouseExists

    kmisFormData = {
      MEMBER_NAME:
        safeValue(member.fullName),

      GENDER:
        safeValue(
          member.personal &&
          member.personal.gender
        ),

      BLOOD_GROUP:
        safeValue(
          member.personal &&
          member.personal.bloodGroup
        ),

      MEMBER_DOB_FULL:
        safeValue(
          member.personal &&
          member.personal.dateOfBirthIso
        ),

      ALUMNI_ASSOCIATION:

          member.alumni &&
          member.alumni.association
        ),

      BRANCH:

          member.alumni &&
          member.alumni.branch
        ),

      YEAR_BATCH:
        safeValue(
          member.alumni &&
          member.alumni.batchYear
        ),

      MEMBER_MOBILE:
        safeValue(
          member.contact &&
          member.contact.mobile
        ),

      MEMBER_WHATSAPP:
        safeValue(
          member.contact &&
          member.contact.whatsapp
        ),

      MEMBER_EMAIL:
        safeValue(
          member.contact &&
          member.contact.email
        ),

      WHATSAPP_GROUP_MEMBER:
        safeValue(
          member.contact &&
          member.contact.whatsappGroupMember
        ),

      CURRENT_LOCATION_COUNTRY:
        safeValue(
          member.location &&
          member.location.country
        ),

      CURRENT_LOCATION_STATE:
        safeValue(
          member.location &&
          member.location.state
        ),

      CURRENT_LOCATION_CITY_DISTRICT:
        safeValue(
          member.location &&
          member.location.cityDistrict
        ),

      LATEST_ADDRESS:
        safeValue(
          member.location &&
          member.location.address
        ),

      HOME_LOCATION_GOOGLE_MAP:
        safeValue(
          member.location &&
          member.location.googleMapLink
        ),

      MEMBER_PRESENT_ACTIVITIES:
        safeValue(
          member.professional &&
          member.professional.presentActivities
        ),

      MEMBER_PROFESSION_SKILLS:
        safeValue(
          member.professional &&

      KEF_KEFGLOBAL_CONTRIBUTIONS:

          member.professional.willingToVolunteer

      SPOUSE_GENDER:

          spouse.personal.gender

      SPOUSE_DOB_FULL:
        safeValue(
          spouse.personal &&
          spouse.personal.dateOfBirthIso

      SPOUSE_MOBILE:

          spouse.contact.mobile

      SPOUSE_WHATSAPP:

          spouse.contact.whatsapp

          spouse.alumni.branch

        safeValue(

          spouse.alumni.batchYear
        ),

      SPOUSE_CURRENT_CITY_DISTRICT:
        safeValue(
          spouse.location &&
          spouse.location.cityDistrict

      SPOUSE_ACTIVITIES:
        safeValue(

          spouse.professional.presentActivities
        ),

          spouse.professional.contributions
        ),

      SPOUSE_WILLING_TO_VOLUNTEER:
        safeValue(
          spouse.professional &&
          spouse.professional.willingToVolunteer
        ),


      WEDDING_DATE_FULL:
        safeValue(
          family.weddingDate &&
          family.weddingDate.iso
        ),

      CHILD_1_NAME_AND_PROFESSION:
        getChildValue(family.children, 0),

      CHILD_2_NAME_AND_PROFESSION:
        getChildValue(family.children, 1),

      CHILD_3_NAME_AND_PROFESSION:
        getChildValue(family.children, 2),

      FAMILY_PHOTO:
        safeValue(
          family.photo &&
          family.photo.existingValue
        ),


      PREFERRED_FAMILY_CONTACT:
        safeValue(
          communication.preferredFamilyContact
        ),

      WILLING_TO_JOIN:
        safeValue(
          communication.willingToJoin
        ),

      DATA_CONSENT:
        normalizeConsentValue(
          communication.dataConsent
        ),

      REMARKS:
        safeValue(
          communication.remarks
        ),


      SUBSCRIPTION_STATUS:
        safeValue(
          subscription.status
        ) || 'NOT PAID',

      SUBSCRIPTION_PAYMENT_DATE:
        safeValue(
          subscription.paymentDateDisplay
        )
    };

      kmisFamilyMembers =
        JSON.parse(
          JSON.stringify(
          familyMembers
          )
        );

      kmisOriginalFamilyMembers =
        JSON.parse(
          JSON.stringify(
          familyMembers
          )
        );

      kmisOriginalFormData =
        JSON.parse(
          JSON.stringify(kmisFormData)
        );
  }


  function renderPortal() {
    hideLoading();
    clearError();

    document
      .getElementById('wizardContainer')
      .classList.remove('hidden');

    document
      .getElementById('welcomeGreeting')
      .textContent =
        kmisProfile.greeting || 'Welcome!';

    updateProfileCompletion();

    kmisCurrentPageIndex = 0;
    renderCurrentPage();
  }


  /**
   * Renders whichever wizard page is currently active.
   */
  function renderCurrentPage() {
    const pageName =
      KMIS_WIZARD_PAGES[kmisCurrentPageIndex];

    document
      .querySelectorAll('.wizardButton')
      .forEach(function (button) {
        button.classList.toggle(
          'active',
          button.dataset.page === pageName
        );
      });

    switch (pageName) {
      case 'overview':
        renderOverviewPage();
        break;

      case 'member':
        renderMemberPage();
        break;

      case 'spouse':
        renderSpousePage();
        break;

      case 'photo':
        renderPhotoPage();
        break;

      case 'family':
        renderFamilyPage();
        break;

      case 'communication':
        renderCommunicationPage();
        break;

      case 'subscription':
        renderSubscriptionPage();
        break;

      case 'review':
        renderReviewPage();
        break;

      default:
        renderOverviewPage();
    }

    updateFooterButtons();

    window.scrollTo({
      top:
        document
          .getElementById('wizardContainer')
          .offsetTop - 10,

      behavior: 'smooth'
    });
  }

  /**

  function renderSpousePage() {
    if (!kmisSpouseSectionEnabled) {

            'Spouse Information',
            'No spouse information is currently recorded in KMIS.',

              in your KEFG Family Profile?

            <div class="decisionActions">
              <button
                type="button"
                id="enableSpouseButton"

                Yes, add spouse details
              </button>

              <button
                type="button"
                id="skipSpouseButton"
                class="secondaryButton"
              >
                No
              </button>
            </div>
          </div>

        .getElementById('enableSpouseButton')

function bindFamilyMemberEntryForm() {

  const addButton =
    document.getElementById(
      'addFamilyMemberButton'

  if (!addButton) {
    return;
  }

  addButton.addEventListener(
    'click',
    addFamilyMemberFromForm
  );
}


function addFamilyMemberFromForm() {

  const fullName =
    getFamilyMemberFieldValue(
      'FM_FULL_NAME'
    );

  const relationship =
    getFamilyMemberFieldValue(
      'FM_FAMILY_RELATION'
    );

  const gender =
    getFamilyMemberFieldValue(
      'FM_GENDER'
    );


  if (!fullName) {

    alert(
      'Please enter the family member’s full name.'
    );

    document
      .getElementById(
        'FM_FULL_NAME'
      )
      .focus();

    return;
  }


  if (!relationship) {

    alert(
      'Please select the relationship.'
    );

    document
      .getElementById(
        'FM_FAMILY_RELATION'
      )
      .focus();

    return;
  }


  if (!gender) {

    alert(
      'Please select the gender.'
    );

    document
      .getElementById(
        'FM_GENDER'
      )
      .focus();

    return;
  }


  const editedValues = {

    FULL_NAME:
      fullName,

    FAMILY_RELATION:
      relationship,

    GENDER:
      gender,

    BLOOD_GROUP:
      getFamilyMemberFieldValue(
        'FM_BLOOD_GROUP'
      ),

    DATE_OF_BIRTH:
      getFamilyMemberFieldValue(
        'FM_DATE_OF_BIRTH'
      ),

    MOBILE:
      getFamilyMemberFieldValue(
        'FM_MOBILE'
      ),

    EMAIL:
      getFamilyMemberFieldValue(
        'FM_EMAIL'
      ),

    FAMILY_PROFESSION_SKILLS:
      getFamilyMemberFieldValue(
        'FM_PROFESSION_SKILLS'
      ),

    FAMILY_ACTIVITIES:
      getFamilyMemberFieldValue(
        'FM_ACTIVITIES'
      ),

    FAMILY_WILLING_TO_VOLUNTEER:
      getFamilyMemberFieldValue(
        'FM_WILLING_TO_VOLUNTEER'
      ),

    REMARKS:
      getFamilyMemberFieldValue(
        'FM_REMARKS'
      )
  };


  /*
   * EDIT EXISTING FAMILY MEMBER
   */
  if (
    kmisEditingFamilyMemberIndex >= 0 &&
    kmisEditingFamilyMemberIndex <
      kmisFamilyMembers.length
  ) {

    const existingMember =
      kmisFamilyMembers[
        kmisEditingFamilyMemberIndex
      ];


    Object.keys(
      editedValues
    ).forEach(function (fieldName) {

      existingMember[fieldName] =
        editedValues[fieldName];

    });


    if (
      existingMember.operation !== 'ADD'
    ) {
      existingMember.operation = 'EDIT';
    }


    alert(
      'Family member changes have been added to the Review page.'
    );

  } else {

    /*
     * ADD NEW FAMILY MEMBER
     */
    kmisFamilyMembers.push({

      operation: 'ADD',

      PERSON_ID: '',
      DEPENDANT_ID: '',
      FAMILY_ID:
        safeValue(
          kmisProfile &&
          kmisProfile.overview &&
          kmisProfile.overview.familyId
        ),

      RELATED_KEFG_ID: '',

      FULL_NAME:
        editedValues.FULL_NAME,

      FAMILY_RELATION:
        editedValues.FAMILY_RELATION,

      GENDER:
        editedValues.GENDER,

      BLOOD_GROUP:
        editedValues.BLOOD_GROUP,

      DATE_OF_BIRTH:
        editedValues.DATE_OF_BIRTH,

      AGE: '',
      RELATION_SEQUENCE: '',
      CARD_ELIGIBLE: '',

      MOBILE:
        editedValues.MOBILE,

      EMAIL:
        editedValues.EMAIL,

      PHOTO_FILE_ID: '',
      PHOTO_URL: '',

      DEPENDENCY_STATUS: '',
      ELIGIBILITY_STATUS: '',
      RECORD_STATUS: '',

      FAMILY_PROFESSION_SKILLS:
        editedValues
          .FAMILY_PROFESSION_SKILLS,

      FAMILY_ACTIVITIES:
        editedValues
          .FAMILY_ACTIVITIES,

      FAMILY_WILLING_TO_VOLUNTEER:
        editedValues
          .FAMILY_WILLING_TO_VOLUNTEER,

      REMARKS:
        editedValues.REMARKS
    });


    alert(
      'New family member has been added to the Review page.'
    );
  }


  clearFamilyMemberEntryForm();

  renderFamilyMembersTable();
}

function getFamilyMemberFieldValue(
  fieldId
) {

  const element =
    document.getElementById(
      fieldId
    );

  if (!element) {
    return '';
  }

  return safeValue(
    element.value
  );
}

function clearFamilyMemberEntryForm() {

  const fieldIds = [
    'FM_FULL_NAME',
    'FM_FAMILY_RELATION',
    'FM_GENDER',
    'FM_BLOOD_GROUP',
    'FM_DATE_OF_BIRTH',
    'FM_MOBILE',
    'FM_EMAIL',
    'FM_PROFESSION_SKILLS',
    'FM_ACTIVITIES',
    'FM_WILLING_TO_VOLUNTEER',
    'FM_REMARKS'
  ];


  fieldIds.forEach(
    function (fieldId) {

      const element =
        document.getElementById(
          fieldId
        );

      if (element) {
        element.value = '';
      }

      kmisFormData[fieldId] = '';
    }
  );


  kmisEditingFamilyMemberIndex = -1;


  const actionButton =
    document.getElementById(
      'addFamilyMemberButton'
    );

  if (actionButton) {
    actionButton.textContent =
      'Submit';
  }
}

function renderFamilyMembersTable() {

  const container =
    document.getElementById(
      'familyMembersTableContainer'
    );

  if (!container) {
    return;
  }

  if (!kmisFamilyMembers.length) {

    container.innerHTML = `
      <div class="familyMembersEmptyState">
        No family members have been added yet.
      </div>
    `;

    return;
  }

  const rowsHtml =
    kmisFamilyMembers
      .map(
        function (
          familyMember,
          index
        ) {

          return `
            <tr>

              <td>
                ${index + 1}
              </td>

              <td>
                ${escapeHtml(
                  familyMember.FULL_NAME
                )}
              </td>

              <td>
                ${escapeHtml(
                  familyMember.FAMILY_RELATION
                )}
              </td>

              <td>
                ${escapeHtml(
                  familyMember.GENDER
                )}
              </td>

              <td>
                ${escapeHtml(
                  familyMember.DATE_OF_BIRTH ||
                  '—'
                )}
              </td>

              <td>
                ${escapeHtml(
                  familyMember.MOBILE ||
                  '—'
                )}
              </td>

              <td>

                <button
                  type="button"
                  class="familyMemberEditButton"
                  data-family-member-index="${index}">

                  Edit

                </button>

                <button
                  type="button"
                  class="familyMemberRemoveButton"
                  data-family-member-index="${index}">

                  Delete

                </button>

              </td>

            </tr>
          `;
        }
      )
      .join('');

  container.innerHTML = `
    <div class="familyMembersTableScroll">

      <table class="familyMembersTable">

        <thead>

          <tr>
            <th>No.</th>
            <th>Full Name</th>
            <th>Relationship</th>
            <th>Gender</th>
            <th>Date of Birth</th>
            <th>Mobile</th>
            <th>Action</th>
          </tr>

        </thead>

        <tbody>
          ${rowsHtml}
        </tbody>

      </table>

    </div>
  `;

  container
  .querySelectorAll(
    '.familyMemberEditButton'
  )
  .forEach(function (button) {

    button.addEventListener(
      'click',
      function () {

        editFamilyMember(
          Number(
            button.dataset.familyMemberIndex
          )
        );

      }
    );

  });

  container
    .querySelectorAll(
      '.familyMemberRemoveButton'
    )
    .forEach(
      function (button) {

        button.addEventListener(
          'click',
          function () {

            const index =
              Number(
                button.dataset
                  .familyMemberIndex
              );

            removeFamilyMember(
              index
            );
          }
        );
      }
    );
}


function removeFamilyMember(index) {

  if (
    index < 0 ||
    index >= kmisFamilyMembers.length
  ) {
    return;
  }

  const confirmed =
    window.confirm(
      'Remove this family member from the list?'
    );

  if (!confirmed) {
    return;
  }

  kmisFamilyMembers.splice(
    index,
    1
  );

  renderFamilyMembersTable();
}

function editFamilyMember(index) {

  if (
    index < 0 ||
    index >= kmisFamilyMembers.length
  ) {
    return;
  }

  kmisEditingFamilyMemberIndex = index;

  const member =
    kmisFamilyMembers[index];

  document.getElementById('FM_FULL_NAME').value =
    member.FULL_NAME || '';

  document.getElementById('FM_FAMILY_RELATION').value =
    member.FAMILY_RELATION || '';

  document.getElementById('FM_GENDER').value =
    member.GENDER || '';

  document.getElementById('FM_BLOOD_GROUP').value =
    member.BLOOD_GROUP || '';

  document.getElementById('FM_DATE_OF_BIRTH').value =
    member.DATE_OF_BIRTH || '';

  document.getElementById('FM_MOBILE').value =
    member.MOBILE || '';

  document.getElementById('FM_EMAIL').value =
    member.EMAIL || '';

  document.getElementById('FM_PROFESSION_SKILLS').value =
    member.FAMILY_PROFESSION_SKILLS ||
    member.PROFESSION_SKILLS ||
    '';

  document.getElementById('FM_ACTIVITIES').value =
    member.FAMILY_ACTIVITIES ||
    member.ACTIVITIES ||
    '';

  document.getElementById('FM_WILLING_TO_VOLUNTEER').value =
    member.FAMILY_WILLING_TO_VOLUNTEER ||
    member.WILLING_TO_VOLUNTEER ||
    '';

  document.getElementById('FM_REMARKS').value =
    member.REMARKS || '';

  document
    .getElementById(
      'addFamilyMemberButton'
    )
    .textContent =
    'Save Changes';

  window.scrollTo({
    top:
      document
        .getElementById('FM_FULL_NAME')
        .offsetTop - 100,
    behavior: 'smooth'
  });

}

  /**
   * Field creation helpers
   */
  function createInputField(
    fieldName,
    label,
    type,
    required,
    fullWidth,
    helpText
  ) {
    return `
      <div class="fieldGroup ${
        fullWidth ? 'fullWidth' : ''
      }">
        ${createInputFieldContent(
          fieldName,
          label,
          type,
          required,
          helpText
        )}
      </div>
    `;
  }


  function createInputFieldContent(
    fieldName,
    label,
    type,
    required,
    helpText
  ) {
    return `
      <label
        class="fieldLabel"
        for="${escapeAttribute(fieldName)}"
      >
        ${escapeHtml(label)}
        ${
          required
            ? '<span class="requiredMark">*</span>'
            : ''
        }
      </label>

      <input
        id="${escapeAttribute(fieldName)}"
        name="${escapeAttribute(fieldName)}"
        data-kmis-field="${escapeAttribute(fieldName)}"
        type="${escapeAttribute(type || 'text')}"
        value="${escapeAttribute(
          kmisFormData[fieldName] || ''
        )}"
        ${required ? 'required' : ''}
      >

      ${
        helpText
          ? `
            <div class="fieldHelp">
              ${escapeHtml(helpText)}
            </div>
          `
          : ''
      }
    `;
  }


  function createTextareaField(
    fieldName,
    label,
    required,
    fullWidth,
    helpText
  ) {
    return `
      <div class="fieldGroup ${
        fullWidth ? 'fullWidth' : ''
      }">
        <label
          class="fieldLabel"
          for="${escapeAttribute(fieldName)}"
        >
          ${escapeHtml(label)}
          ${
            required
              ? '<span class="requiredMark">*</span>'
              : ''
          }
        </label>

        <textarea
          id="${escapeAttribute(fieldName)}"
          name="${escapeAttribute(fieldName)}"
          data-kmis-field="${escapeAttribute(fieldName)}"
          ${required ? 'required' : ''}
        >${escapeHtml(
          kmisFormData[fieldName] || ''
        )}</textarea>

        ${
          helpText
            ? `
              <div class="fieldHelp">
                ${escapeHtml(helpText)}
              </div>
            `
            : ''
        }
      </div>
    `;
  }


  function createSelectField(
    fieldName,
    label,
    options,
    required,
    fullWidth
  ) {
    const currentValue =
      safeValue(kmisFormData[fieldName]);

    const optionHtml =
      ['']
        .concat(options || [])
        .map(function (option) {
          const selected =
            String(option) === currentValue
              ? 'selected'
              : '';

          return `
            <option
              value="${escapeAttribute(option)}"
              ${selected}
            >
              ${
                option
                  ? escapeHtml(option)
                  : '— Select —'
              }
            </option>
          `;
        })
        .join('');

    return `
      <div class="fieldGroup ${
        fullWidth ? 'fullWidth' : ''
      }">
        <label
          class="fieldLabel"
          for="${escapeAttribute(fieldName)}"
        >
          ${escapeHtml(label)}
          ${
            required
              ? '<span class="requiredMark">*</span>'
              : ''
          }
        </label>

        <select
          id="${escapeAttribute(fieldName)}"
          name="${escapeAttribute(fieldName)}"
          data-kmis-field="${escapeAttribute(fieldName)}"
          ${required ? 'required' : ''}
        >
          ${optionHtml}
        </select>
      </div>
    `;
  }


  function createAlumniSelectField(
    fieldName,
    label,
    personType
  ) {
    return createSelectField(
      fieldName,
      label,
      getAlumniOptions(),
      true,
      false
    ).replace(
      'data-kmis-field="' + fieldName + '"',
      'data-kmis-field="' +
        fieldName +
        '" data-alumni-person="' +
        personType +
        '"'
    );
  }


  function createConsentRadio(option) {
    const checked =
      kmisFormData.DATA_CONSENT === option
        ? 'checked'
        : '';

    return `
      <label class="radioOption">
        <input
          type="radio"
          name="DATA_CONSENT"
          value="${escapeAttribute(option)}"
          ${checked}
        >

        <span>${escapeHtml(option)}</span>
      </label>
    `;
  }


  /**
   * Field binding
   */
  function bindEditableFields() {
    document
      .querySelectorAll('[data-kmis-field]')
      .forEach(function (element) {
        element.addEventListener(
          'input',
          handleFieldChange
        );

        element.addEventListener(
          'change',
          handleFieldChange
        );
      });

    document
      .querySelectorAll('[data-alumni-person]')
      .forEach(function (element) {
        element.addEventListener(
          'change',
          function () {
            updateAlumniDependentFields(
              element.dataset.alumniPerson
            );
          }
        );
      });
  }


  function handleFieldChange(event) {
    const fieldName =
      event.target.dataset.kmisField;

    if (!fieldName) {
      return;
    }

    kmisFormData[fieldName] =
      event.target.value;

    updateProfileCompletion();
  }


  function bindConsentFields() {
    document
      .querySelectorAll(
        'input[name="DATA_CONSENT"]'
      )
      .forEach(function (radio) {
        radio.addEventListener(
          'change',
          function () {
            kmisFormData.DATA_CONSENT =
              radio.value;

            updateProfileCompletion();
          }
        );
      });
  }


  /**
   * Alumni rules
   */
  function updateAlumniDependentFields(personType) {
    const isMember =
      personType === 'member';

    const associationField =
      isMember
        ? 'ALUMNI_ASSOCIATION'
        : 'SPOUSE_ALUMNI_ASSOCIATION';

    const branchField =
      isMember
        ? 'BRANCH'
        : 'SPOUSE_BRANCH';

    const batchField =
      isMember
        ? 'YEAR_BATCH'
        : 'SPOUSE_BATCH_YEAR';

    const branchGroup =
      document.getElementById(
        isMember
          ? 'memberBranchGroup'
          : 'spouseBranchGroup'
      );

    const batchGroup =
      document.getElementById(
        isMember
          ? 'memberBatchGroup'
          : 'spouseBatchGroup'
      );

    const notApplicable =
      kmisFormData[associationField] ===
      'NOT APPLICABLE';

    if (branchGroup) {
      branchGroup.classList.toggle(

  /**
   * Photo validation and preview
   */
  function validateAndPreviewPhoto(event) {
    const file =
      event.target.files &&
      event.target.files[0];

    if (!file) {
      return;
    }

    const rules =
      kmisConfiguration.photoRules || {};

    const allowedMimeTypes =
      rules.allowedMimeTypes || [
        'image/jpeg',
        'image/png'
      ];

    if (
      !allowedMimeTypes.includes(file.type)
    ) {
      rejectPhoto(
        'Only JPG, JPEG or PNG files are allowed.'
      );

      return;
    }

    if (
      file.size >
      Number(rules.maximumBytes || 2097152)
    ) {
      rejectPhoto(
        'The selected photo is larger than 2 MB.'
      );

      return;
    }

    const reader =
      new FileReader();

    reader.onload = function (readerEvent) {
      const image =
        new Image();

      image.onload = function () {
        const minimumWidth =
          Number(rules.minimumWidth || 800);

        const minimumHeight =
          Number(rules.minimumHeight || 600);

        if (
          image.width < minimumWidth ||
          image.height < minimumHeight
        ) {
          rejectPhoto(
            'The photo must be at least ' +
            minimumWidth +
            ' × ' +
            minimumHeight +
            ' pixels.'
          );

          return;
        }

        const actualRatio =
          image.width / image.height;

        const expectedRatio =
          4 / 3;

        const ratioDifference =
          Math.abs(
            actualRatio - expectedRatio
          );

        if (ratioDifference > 0.12) {
          rejectPhoto(
            'Please use a landscape photo close to the 4:3 aspect ratio.'
          );

          return;
        }

        kmisSelectedPhoto = file;
        kmisSelectedPhotoPreview =
          readerEvent.target.result;

        showPhotoMessage(
          'Photo accepted: ' +
          file.name +
          ' (' +
          image.width +
          ' × ' +
          image.height +
          ' pixels).',
          'success'
        );

        displayPhotoPreview(
          kmisSelectedPhotoPreview
        );
      };

      image.onerror = function () {
        rejectPhoto(
          'The selected image could not be read.'
        );
      };

      image.src =
        readerEvent.target.result;
    };

    reader.onerror = function () {
      rejectPhoto(
        'The selected image could not be read.'
      );
    };

    reader.readAsDataURL(file);
  }

/**
 * Returns only the fields that actually changed.
 */
function getChangedFields() {

  const changedFields = {};

  Object.keys(kmisFormData).forEach(function(fieldName) {

    const oldValue =
      String(
        kmisOriginalFormData[fieldName] || ''
      );

    const newValue =
      String(
        kmisFormData[fieldName] || ''
      );

    if (oldValue !== newValue) {

      changedFields[fieldName] = {
        old: oldValue,
        new: newValue
      };

    }

  });

  if (kmisSelectedPhoto) {

    changedFields.FAMILY_PHOTO = {

      old:
        kmisOriginalFormData.FAMILY_PHOTO || '',

      new:
        '[NEW PHOTO SELECTED]'

    };

  }

  return changedFields;

}

/**
 * Creates one common SUBMISSION_ID for the complete portal submission.
 * The same ID is used for Profile and Family Member requests.
 */
function createCommonSubmissionId() {
  const now = new Date();

  const pad = function (value) {
    return String(value).padStart(2, '0');
  };

  const timestamp =
    now.getFullYear() +
    pad(now.getMonth() + 1) +
    pad(now.getDate()) + '-' +
    pad(now.getHours()) +
    pad(now.getMinutes()) +
    pad(now.getSeconds());

  const randomPart =
    Math.random()
      .toString(36)
      .substring(2, 10)
      .toUpperCase();

  return 'SUB-' + timestamp + '-' + randomPart;
}


/**
 * ============================================================
 * Submit Family Profile
 * ============================================================
 */

function submitProfileUpdate() {

  if (!kmisSessionToken) {
    showError(
      'Your KGMIS session has expired. Please sign in again.'
    );

    return;
  }


  const changedFields =
    getChangedFields();

  const changedSections =
    determineChangedSections();

  const familyMembersSubmissionData =
    buildFamilyMemberSubmissionData();

  const hasProfileChanges =
    Object.keys(
      changedFields
    ).length > 0;

  const hasFamilyMemberChanges =
    familyMembersSubmissionData.length > 0;

  const commonSubmissionId =
    createCommonSubmissionId();


  if (
    !hasProfileChanges &&
    !hasFamilyMemberChanges
  ) {
    showError(
      'No profile changes or Family Member changes were found for submission.'
    );

    return;
  }


  const profileSubmissionData = {

    formData:
      changedFields,

    changedSections:
      changedSections,

    spouseSectionEnabled:
      kmisSpouseSectionEnabled,

    photo: {

      fileName:
        kmisSelectedPhoto
          ? kmisSelectedPhoto.name
          : '',

      mimeType:
        kmisSelectedPhoto
          ? kmisSelectedPhoto.type
          : '',

      fileReference:
        ''
    }
  };


  /*
   * Case 1:
   * Both Profile and Family Members changed.
   */
  if (
    hasProfileChanges &&
    hasFamilyMemberChanges
  ) {

    google.script.run

      .withSuccessHandler(
        function (profileResult) {

          google.script.run

            .withSuccessHandler(
              function (familyResult) {

                alert(
                  'Your updates have been submitted successfully.' +
                  '\n\nProfile Submission ID: ' +
                  profileResult.submissionId +
                  '\nProfile Request ID: ' +
                  profileResult.requestId +
                  '\nFamily Member Submission ID: ' +
                  familyResult.submissionId +
                  '\nFamily Member Request ID: ' +
                  familyResult.requestId +
                  '\nFamily Members Submitted: ' +
                  familyResult.familyMemberCount
                );

              }
            )

            .withFailureHandler(
              function (error) {

                showError(
                  'The Profile update was submitted, but the Family Member submission failed. ' +
                  (
                    error && error.message
                      ? error.message
                      : safeValue(error)
                  )
                );

              }
            )

            .KMIS_FP_PORTAL_SaveFamilyMemberUpdates(
              kmisSessionToken,
              familyMembersSubmissionData,
              commonSubmissionId
            );

        }
      )

      .withFailureHandler(
        showError
      )

      .KMIS_FP_PORTAL_SubmitProfileUpdate(
        kmisSessionToken,
        profileSubmissionData,
        commonSubmissionId
      );

    return;
  }


  /*
   * Case 2:
   * Only Profile information changed.
   */
  if (hasProfileChanges) {

    google.script.run

      .withSuccessHandler(
        function (profileResult) {

          alert(
            profileResult.message +
            '\n\nRequest ID: ' +
            profileResult.requestId
          );

        }
      )

      .withFailureHandler(
        showError
      )

      .KMIS_FP_PORTAL_SubmitProfileUpdate(
        kmisSessionToken,
        profileSubmissionData,
        commonSubmissionId
      );

    return;
  }


  /*
   * Case 3:
   * Only Family Members changed.
   */
  google.script.run

    .withSuccessHandler(
      function (familyResult) {

        alert(
          familyResult.message +
          '\n\nSubmission ID: ' +
          familyResult.submissionId +
          '\nRequest ID: ' +
          familyResult.requestId
        );

      }
    )

    .withFailureHandler(
      showError
    )

    .KMIS_FP_PORTAL_SaveFamilyMemberUpdates(
      kmisSessionToken,
      familyMembersSubmissionData,
      commonSubmissionId
    );

}

  /**
   * Completion calculations
   */
  function updateProfileCompletion() {
    const checks = [
      kmisFormData.MEMBER_NAME,
      kmisFormData.MEMBER_MOBILE,
      kmisFormData.MEMBER_WHATSAPP,
      kmisFormData.CURRENT_LOCATION_COUNTRY,
      kmisFormData.CURRENT_LOCATION_CITY_DISTRICT,
      kmisFormData.PREFERRED_FAMILY_CONTACT,
      kmisFormData.DATA_CONSENT
    ];

    if (kmisSpouseSectionEnabled) {
      checks.push(
        kmisFormData.SPOUSE_NAME
      );
    }

    const completeCount =
      checks.filter(
        function (value) {
          return Boolean(
            safeValue(value)
          );
        }
      ).length;

    const percentage =
      checks.length
        ? Math.round(
            completeCount /
            checks.length *
            100
          )
        : 0;

    const percentageElement =
      document.getElementById(
        'completionPercentage'
      );

    const progressElement =
      document.getElementById(
        'progressFill'
      );

    if (percentageElement) {
      percentageElement.textContent =
        percentage + '%';
    }

    if (progressElement) {

  progressElement.style.width =
    percentage + '%';

  if (percentage < 50) {

    progressElement.style.backgroundColor =
      '#dc2626';

  } else if (percentage < 80) {

    progressElement.style.backgroundColor =
      '#f59e0b';

  } else {

    progressElement.style.backgroundColor =
      '#16a34a';

  }
}
}

  function getSectionStatus(sectionName) {
    let complete = false;

    switch (sectionName) {
      case 'member':
        complete =
          Boolean(
            safeValue(
              kmisFormData.MEMBER_NAME
            )
          ) &&
          Boolean(
            safeValue(
              kmisFormData.MEMBER_MOBILE
            )
          ) &&
          Boolean(
            safeValue(
              kmisFormData
                .CURRENT_LOCATION_COUNTRY
            )
          );
        break;

      case 'spouse':
        complete =
          !kmisSpouseSectionEnabled ||
          Boolean(
            safeValue(
              kmisFormData.SPOUSE_NAME
            )
          );
        break;

      case 'family':
        complete =
          Boolean(
            safeValue(
              kmisFormData.WEDDING_DATE_FULL
            )
          ) ||
          Boolean(
            safeValue(
              kmisFormData.FAMILY_PHOTO
            )
          ) ||
          Boolean(kmisSelectedPhoto);
        break;

      case 'communication':
        complete =
          Boolean(
            safeValue(
              kmisFormData
                .PREFERRED_FAMILY_CONTACT
            )
          ) &&
          Boolean(
            safeValue(
              kmisFormData.DATA_CONSENT
            )
          );
        break;

      default:
        complete = false;
    }

    return complete
      ? 'complete'
      : 'needs-review';
  }

    status
  ) {
    switch (
      String(status || '')
        .trim()
        .toUpperCase()
    ) {
      case 'PAID':
        return 'paid';

      case 'PENDING':
        return 'pending';

      case 'EXEMPTED':
        return 'exempted';

      case 'NOT PAID':
      default:
        return 'notPaid';
    }
  }


  function getExistingPhotoUrl() {
    const value =
      safeValue(
        kmisFormData.FAMILY_PHOTO
      );

    if (
      value.startsWith('http://') ||
      value.startsWith('https://') ||
      value.startsWith('data:image/')
    ) {
      return value;
    }

    return '';
  }


  function getChildValue(
    children,
    index
  ) {
    if (
      !Array.isArray(children) ||
      !children[index]
    ) {
      return '';
    }

    return safeValue(
      children[index]
        .nameAndProfession
    );
  }


  function normalizeAlumniAssociation(
    value
  ) {
    const normalized =
      safeValue(value).toUpperCase();

    if (!normalized) {
      return '';
    }

    const mapping = {
      CET: 'CETA',
      CETA: 'CETA',
      KEA: 'KEA',
      MACE: 'MACE',
      NIT: 'NIT',
      NSS: 'NSS',
      TEC: 'TEC',
      TKMCE: 'TKMCE',
      AECK: 'AECK',
      'NOT APPLICABLE':
        'NOT APPLICABLE'
    };

    return mapping[normalized] || '';
  }


  function normalizeConsentValue(
    value
  ) {
    const normalized =
      safeValue(value).toUpperCase();

    if (
      normalized === 'YES' ||
      normalized === 'AGREE' ||
      normalized === 'I AGREE' ||
      normalized === 'GIVEN'
    ) {
      return 'I AGREE';
    }

    if (
      normalized === 'NO' ||
      normalized ===
        'I DO NOT AGREE' ||
      normalized === 'NOT GIVEN'
    ) {
      return 'I DO NOT AGREE';
    }

    return '';
  }


  function safeValue(value) {
    if (
      value === null ||
      value === undefined
    ) {
      return '';
    }

    return String(value).trim();
  }


  function escapeHtml(value) {
    return safeValue(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }


  function escapeAttribute(value) {
    return escapeHtml(value);
  }


  function hideLoading() {
    const panel =
      document.getElementById(
        'loadingPanel'
      );

    if (panel) {
      panel.classList.add('hidden');
    }
  }


  function clearError() {
    const panel =
      document.getElementById(
        'errorPanel'
      );

    if (!panel) {
      return;
    }

    panel.textContent = '';
    panel.classList.add('hidden');
  }


  function showError(error) {
    hideLoading();

    const message =
      error && error.message
        ? error.message
        : safeValue(error) ||
          'An unexpected error occurred.';

    const panel =
      document.getElementById(
        'errorPanel'
      );

    panel.textContent = message;
    panel.classList.remove('hidden');

    panel.scrollIntoView({
      behavior: 'smooth',
      block: 'center'
    });
  }

window.KGMIS_FAMILY_SELF_SERVICE_PROFILE_MODULE = {
  activate: activateFamilySelfServiceProfile
};

</script>
